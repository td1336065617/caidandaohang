name: menu_navigation
display_name: 菜单导航
short_desc: 自动聚合各插件菜单的导航
desc: |
  发送“菜单”即可查看已安装插件的聚合菜单。
  约定：插件根目录放置 menu.md（或 metadata.yaml 声明 menu 字段），
  内容会提取为菜单指令摘要并在触发时生成图片；无需修改各插件代码。
  可在 WebUI 中选择参与聚合的插件。
version: 1.2.5
author: td1336065617
repo: https://github.com/td1336065617/caidandaohang/tree/master
astrbot_version: ">=4.13.0,<5"
support_platforms:
  - qq_official
